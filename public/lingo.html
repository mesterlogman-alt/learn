<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lingo Memory</title>
<style>body{font-family:system-ui,sans-serif;display:grid;place-items:center;min-height:100dvh;margin:0;background:#f4f7fb;color:#334} .box{text-align:center;padding:2rem}</style>
</head>
<body>
<div class="box" id="st">جاري تحميل التطبيق…</div>
<script>
(async function(){
  const n = 6;
  try{
    const parts = [];
    for(let i=0;i<n;i++){
      const r = await fetch('lingo-part'+i+'.txt?t='+Date.now());
      if(!r.ok) throw new Error('part '+i+' '+r.status);
      parts.push(await r.text());
    }
    const b64 = parts.join('');
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
    const html = new TextDecoder('utf-8').decode(bytes);
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    document.getElementById('st').textContent = 'تعذر التحميل: '+e.message;
    console.error(e);
  }
})();
</script>
</body>
</html>
