<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lingo Memory</title>
<style>body{font-family:system-ui,sans-serif;display:grid;place-items:center;min-height:100dvh;margin:0;background:#f4f7fb;color:#334}.box{text-align:center;padding:2rem}a{color:#2c4f9d}</style>
</head>
<body>
<div class="box" id="st">جاري فتح التطبيق…</div>
<script>
(async function(){
  const url = 'https://litter.catbox.moe/hil51w.html';
  try{
    const r = await fetch(url + '?t=' + Date.now(), {cache:'no-store'});
    if(!r.ok) throw new Error('HTTP ' + r.status);
    const html = await r.text();
    if(!html || html.length < 10000) throw new Error('ملف غير مكتمل');
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    document.getElementById('st').innerHTML =
      'تعذر التحميل: ' + (e && e.message ? e.message : e) +
      '<br><br><a href="' + url + '">افتح التطبيق مباشرة</a>';
    console.error(e);
  }
})();
</script>
</body>
</html>
